[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-semantic-atlas"
version = "0.1.0"
description = "Local multilingual neural retrieval with pinned artifacts and explicit admission"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "LOFRANO TECNOLOGIA"}]
dependencies = ["numpy==2.5.4", "onnxruntime==1.31.1", "tokenizers==0.23.3"]

[project.urls]
Homepage = "https://lofranotecnologia.com.br"

[project.scripts]
local-semantic-atlas = "local_semantic_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["local_semantic_atlas"]
include-package-data = true

[tool.setuptools.package-data]
local_semantic_atlas = ["_data/**/*"]
